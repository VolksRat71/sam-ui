# sam-ui (Apache-2.0). New file, not from SAM 2.
# Build the macOS (arm64) desktop app. A tag v* publishes it as a GitHub release;
# a manual run (workflow_dispatch) only uploads the dmg as a build artifact.
name: desktop-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac-arm64:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build studio (served by the bundled backend)
        working-directory: studio
        run: |
          npm ci
          VITE_API_ENDPOINT=same-origin npm run build

      - name: Build the bundled Python (CPython + locked deps + sam2)
        working-directory: desktop
        run: bash scripts/build-python.sh

      - name: Package the dmg (unsigned)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm test
          npx electron-builder --mac dmg --arm64 --publish never
          ls -la dist/*.dmg

      - name: Upload the dmg as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: sam-ui-mac-arm64
          path: desktop/dist/*.dmg
          retention-days: 14

      - name: Publish the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" desktop/dist/*.dmg \
            --title "sam-ui $GITHUB_REF_NAME" \
            --notes-file desktop/RELEASE_NOTES.md
