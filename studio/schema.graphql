}

type ObjectRange {
  start: Int!
  end: Int!
  state: String!
}

type EngineTrack {
  engine: String!
  model: String!
  state: String!
  frames: [Int!]
  nFrames: Int!
}

type SeedFrame {
  frameIndex: Int!
