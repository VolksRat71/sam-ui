  clearTrack(input: ClearTrackInput!): ObjectTrack!
  setObjectRange(input: SetObjectRangeInput!): ObjectTrack!
  deleteVideo(input: DeleteVideoInput!): DeleteVideo!
  createDeletionId: String!
  acceptTos: Boolean!
  acceptTermsOfService: String!
  uploadVideo(
    file: Upload!
    startTimeSec: Float = null
    durationTimeSec: Float = null
  ): Video!
  uploadSharedVideo(file: Upload!): SharedVideo!
  uploadAnnotations(file: Upload!): Boolean!
}

input DeleteVideoInput {
  path: String!
