# Modified by sam-ui: ObjectTrack, EngineTrack, SeedFrame, objectTracks, clearTrack, StartSession.objects,
# deleteVideo (closeIdleSessions, sessionsClosed), ObjectRange, setObjectRange, SeedFrame.text.

input AddPointsInput {
  sessionId: String!
  frameIndex: Int!
  clearOldPoints: Boolean!
  objectId: Int!
  labels: [Int!]!
  points: [[Float!]!]!
  # sam-ui: the engine studio shows; null counts as SAM 2
  engine: String
}

type CancelPropagateInVideo {
  success: Boolean!
}

input CancelPropagateInVideoInput {
  sessionId: String!
}

input ClearPointsInFrameInput {
  sessionId: String!
  frameIndex: Int!
  objectId: Int!
}

type ClearPointsInVideo {
  success: Boolean!
}

input ClearPointsInVideoInput {
  sessionId: String!
}

type CloseSession {
  success: Boolean!
}

input CloseSessionInput {
  sessionId: String!
}

type Mutation {
  startSession(input: StartSessionInput!): StartSession!
  closeSession(input: CloseSessionInput!): CloseSession!
  addPoints(input: AddPointsInput!): RLEMaskListOnFrame!
  clearPointsInFrame(input: ClearPointsInFrameInput!): RLEMaskListOnFrame!
  clearPointsInVideo(input: ClearPointsInVideoInput!): ClearPointsInVideo!
  removeObject(input: RemoveObjectInput!): [RLEMaskListOnFrame!]!
  cancelPropagateInVideo(
    input: CancelPropagateInVideoInput!
  ): CancelPropagateInVideo!
  # sam-ui: drop one object's cached track; its seeds stay
  clearTrack(input: ClearTrackInput!): ObjectTrack!
  # sam-ui: mark frames of an object absent, or clear them (state null)
  setObjectRange(input: SetObjectRangeInput!): ObjectTrack!
  # sam-ui: delete an uploaded video (never a gallery one)
  deleteVideo(input: DeleteVideoInput!): DeleteVideo!
}

# sam-ui: deleting uploads
input DeleteVideoInput {
  # as `videos` lists it, e.g. uploads/<hash>.mp4
  path: String!
  # also drop its seeds and cached tracks
  purgeTracks: Boolean! = true
  # first close sessions on it idle over 60 s with no running job (tabs that went away)
  closeIdleSessions: Boolean! = false
}

type DeleteVideo {
  path: String!
  purged: Boolean!
  # how many idle sessions closeIdleSessions closed
  sessionsClosed: Int!
}

# sam-ui: per-object tracks
input ClearTrackInput {
  sessionId: String!
  objectId: Int!
  # one engine's track; every engine's when null
  engine: String
}

# sam-ui: set frames start-end (inclusive) of an object to a range state
input SetObjectRangeInput {
  sessionId: String!
  objectId: Int!
  start: Int!
  end: Int!
  # "absent"; null clears whatever range covers the frames
  state: String
}

# sam-ui: a span of an object's frames, inclusive. "absent" is the only state:
# the object is not in the shot, so the frames are empty and never tracked.
type ObjectRange {
  start: Int!
  end: Int!
  state: String!
}

type EngineTrack {
  engine: String!
  model: String!
  # untracked | stale | tracked | tracking
  state: String!
  frames: [Int!]
  nFrames: Int!
}

type SeedFrame {
  frameIndex: Int!
  points: [[Float!]!]!
  labels: [Int!]!
  # the approved mask on this frame, if recorded
  mask: RLEMask
  # the text prompt that seeded the frame (SAM 3), if any
  text: String
}

type ObjectTrack {
  objectId: Int!
  # untracked | stale | tracked
  state: String!
  engine: String!
  model: String!
  frames: [Int!]
  nFrames: Int!
  seeds: [SeedFrame!]!
  # every engine's track (the top-level fields are the default engine's)
  tracks: [EngineTrack!]!
  # absent ranges, sorted
  ranges: [ObjectRange!]!
}

input PingInput {
  sessionId: String!
}

type Pong {
  success: Boolean!
}

type Query {
  ping(input: PingInput!): Pong!
  # sam-ui: every object known for the session's video
  objectTracks(sessionId: String!): [ObjectTrack!]!
}

type RLEMask {
  size: [Int!]!
  counts: String!
  order: String!
}

type RLEMaskForObject {
  objectId: Int!
  rleMask: RLEMask!
}

type RLEMaskListOnFrame {
  frameIndex: Int!
  rleMaskList: [RLEMaskForObject!]!
}

input RemoveObjectInput {
  sessionId: String!
  objectId: Int!
}

type StartSession {
  sessionId: String!
  # sam-ui: objects already known for this video
  objects: [ObjectTrack!]!
}

input StartSessionInput {
  path: String!
}
